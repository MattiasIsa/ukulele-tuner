<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Uke Tuner">
<meta name="theme-color" content="#F1EEE4">
<title>Uke Tuner</title>
<style>
/* Swiss layout: tuning tabs on top, the headstock as the control surface, a ruler scale below. */
:root {
  --paper: #F1EEE4; --light: #FFFDF6; --ink: #111111; --muted: #65625A;
  --red: #D9141E; --string: #FF3038;
  --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overscroll-behavior: none; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--font);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  padding: env(safe-area-inset-top, 0px) max(20px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(20px, env(safe-area-inset-left, 0px));
}
button { font: inherit; color: inherit; background: none; border: 0; border-radius: 0; padding: 0; cursor: pointer; text-align: left; }
[hidden] { display: none !important; }
body { display: flex; flex-direction: column; }
.app, .chords, .scores { flex: 1; min-height: 0; width: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; }
.views { display: flex; justify-content: space-between; align-items: stretch; flex: none; width: 100%; max-width: 480px; margin: 0 auto; border-bottom: 4px solid var(--ink); }
.views button { min-height: 60px; display: flex; align-items: flex-end; padding: 0 2px 8px; font-size: 22px; line-height: 1; font-weight: 700; letter-spacing: -.02em; color: var(--ink); margin-bottom: -4px; border-bottom: 4px solid var(--ink); }
.views button.on { font-size: 38px; color: var(--red); padding-bottom: 5px; border-bottom: 9px solid var(--red); margin-bottom: -6px; }
.chords { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 0 12px; }
#roots { display: grid; grid-template-columns: repeat(6, 1fr); border-top: 1px solid #CBC7BA; border-left: 1px solid #CBC7BA; flex: none; }
#roots button { min-height: 44px; font-size: 18px; font-weight: 700; text-align: center; border-right: 1px solid #CBC7BA; border-bottom: 1px solid #CBC7BA; line-height: 1.05; }
#roots small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }
#roots .on { background: var(--red); color: #fff; } #roots .on small { color: #fff; }
#types { display: flex; justify-content: space-between; gap: 6px; flex: none; margin-top: 4px; }
#types button { min-height: 44px; font-size: clamp(13px, 4vw, 16px); color: var(--muted); border-bottom: 2px solid transparent; }
#types .on { color: var(--ink); font-weight: 700; border-bottom: 4px solid var(--red); }
.title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 8px; flex: none; }
.title h2 { margin: 0; font-size: 38px; line-height: 1; letter-spacing: -.02em; white-space: nowrap; }
.title span { font-size: 14px; color: var(--muted); text-align: right; }
#boardBtn { display: block; width: 100%; flex: 1 0 180px; min-height: 180px; margin-top: 8px; }
#board { display: block; width: 100%; height: 100%; max-height: 340px; }
#board text, #ways text { font-family: var(--font); font-weight: 700; }
.row { display: flex; align-items: center; gap: 12px; flex: none; min-height: 44px; }
.row > span { font-size: 14px; color: var(--muted); flex: none; }
#fingersRow { display: flex; gap: 8px; overflow-x: auto; }
#fingersRow button { min-height: 44px; min-width: 64px; padding: 0 8px; text-align: center; font-size: 16px; white-space: nowrap; color: var(--muted); border-bottom: 2px solid #CBC7BA; }
#fingersRow .on { color: var(--ink); font-weight: 700; border-bottom: 4px solid var(--red); }
.strums { display: grid; grid-template-columns: 1.4fr 1fr 1.4fr; gap: 8px; flex: none; margin-top: 4px; }
.strums button { min-height: 44px; padding: 0 12px; font-size: 15px; font-weight: 700; white-space: nowrap; border: 2px solid var(--ink); }
.strums button:first-child { background: var(--ink); color: var(--light); }
.strums button:active { background: var(--red); border-color: var(--red); color: #fff; }
#ways { display: flex; gap: 8px; overflow-x: auto; flex: none; margin-top: 4px; padding-bottom: 4px; }
#ways button { flex: 0 0 66px; border: 2px solid #CBC7BA; padding: 3px; }
#ways .on { border-color: var(--red); } #ways svg { display: block; width: 100%; }
.scores { display: block; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 0 20px; }
#songList h2 { font-size: 26px; margin: 18px 0 8px; letter-spacing: -.01em; }
.songrow { width: 100%; min-height: 58px; display: flex; justify-content: space-between; align-items: center; gap: 12px; border-top: 1px solid #CBC7BA; font-size: 17px; font-weight: 700; }
.songrow span { min-width: 0; } .songrow span:last-child { text-align: right; color: var(--red); font-size: 15px; flex: none; }
.songrow small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); margin-top: 2px; }
#songBack { min-height: 44px; font-size: 15px; color: var(--muted); }
#songTitle { margin: 0; font-size: 28px; line-height: 1.05; letter-spacing: -.02em; text-wrap: balance; }
.sub { margin: 4px 0 8px; font-size: 13px; color: var(--muted); }
#player { position: sticky; top: 0; z-index: 2; background: var(--paper); padding: 8px 0; border-bottom: 2px solid var(--ink); }
.prow { display: flex; gap: 8px; align-items: stretch; } .prow + .prow { margin-top: 8px; }
.prow button { min-height: 44px; padding: 0 6px; text-align: center; font-size: 14px; border: 2px solid var(--ink); flex: 1 1 auto; white-space: nowrap; }
.prow button.on { background: var(--ink); color: var(--light); font-weight: 700; }
#playSong { flex: 2 1 auto; background: var(--red); border-color: var(--red); color: #fff; font-size: 18px; font-weight: 700; }
#speeds { display: contents; }
#songStatus { display: block; min-height: 1.3em; font-size: 14px; font-weight: 700; color: var(--red); margin-top: 6px; }
#songChords { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 4px; }
#songChords button { flex: 0 0 72px; border: 2px solid #CBC7BA; padding: 4px; text-align: center; font-size: 17px; }
#songChords svg { display: block; width: 100%; } #songChords text { font-family: var(--font); font-weight: 700; }
#songChords .now { border-color: var(--red); background: var(--light); }
.lyric { display: flex; flex-wrap: wrap; align-items: flex-end; margin-top: 10px; font-size: 20px; }
.syl { display: inline-flex; flex-direction: column; align-items: flex-start; margin-right: 6px; cursor: pointer; line-height: 1.25; }
.syl.join { margin-right: 1px; } .syl i { height: 30px; }
.chordtag { min-height: 30px; min-width: 34px; padding: 0 4px 0 0; font-size: 17px; font-weight: 700; color: var(--red); text-decoration: underline; text-underline-offset: 3px; }
.syl.now > span { background: var(--red); color: #fff; }
.tabline { margin-top: 12px; } .tabline svg { display: block; width: 100%; } .tabline text { font-family: var(--font); font-weight: 700; } .tabline .tabword { font-weight: 400; }
.tabchord { cursor: pointer; } .tabnote.now circle { fill: var(--red); } .tabnote.now circle + text { fill: #fff; }
#sheetBoard { display: block; width: 100%; height: 250px; } #sheetBoard text { font-family: var(--font); font-weight: 700; }
#chordSheet h2 { font-size: 38px; margin: 0; line-height: 1; }
#chordNote { margin: 6px 0 0; font-size: 13px; line-height: 1.35; color: var(--muted); flex: none; }
.tabs { display: grid; grid-template-columns: 1fr 1fr 1.25fr; gap: 12px; padding-top: 8px; }
.tabs button { min-height: 46px; font-size: clamp(14px, 4.4vw, 17px); color: var(--muted); border-bottom: 2px solid #CBC7BA; white-space: nowrap; }
.tabs button.on { font-weight: 700; color: var(--ink); border-bottom: 4px solid var(--red); }
#head { flex: 1; min-height: 0; width: 100%; display: block; margin-top: 8px; }
#head text { font-family: var(--font); font-weight: 700; pointer-events: none; }
.peg { cursor: pointer; touch-action: none; outline: none; }
.peg:focus-visible .knob { stroke: var(--red); stroke-width: 4; }
.panel { border-top: 2px solid var(--ink); padding: 14px 0 12px; }
.line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; min-height: 32px; font-size: clamp(20px, 6.2vw, 27px); font-weight: 700; letter-spacing: -.01em; }
#status { min-width: 0; }
#cents { white-space: nowrap; font-variant-numeric: tabular-nums; }
.off #status { color: var(--red); }
#scale { display: block; width: 100%; height: auto; margin-top: 8px; overflow: visible; }
#scale text { font-family: var(--font); font-size: 11px; fill: var(--muted); }
#mark { transition: transform .12s linear; }
.hint { margin: 8px 0 0; font-size: 14px; line-height: 1.3; min-height: 2.6em; color: var(--muted); }
dialog { width: 100%; max-width: 480px; margin: auto auto 0; border: 0; border-top: 4px solid var(--red); padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--light); color: var(--ink); max-height: 90%; overflow-y: auto; }
dialog::backdrop { background: rgba(17,17,17,.55); }
dialog h2 { font-size: 20px; margin: 0 0 8px; }
.opt { width: 100%; min-height: 52px; display: flex; justify-content: space-between; align-items: center; gap: 12px; border-top: 1px solid #CBC7BA; font-size: 17px; }
.opt span { color: var(--muted); font-size: 15px; white-space: nowrap; }
.opt.on { font-weight: 700; } .opt.on span { color: var(--red); }
.note { margin: 0; padding: 10px 0; font-size: 13px; line-height: 1.4; color: var(--muted); border-top: 1px solid #CBC7BA; }
#close, .close { width: 100%; min-height: 50px; margin-top: 8px; padding: 0 16px; background: var(--ink); color: var(--light); font-weight: 700; font-size: 17px; }
button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
@media (max-height: 520px) { .hint { min-height: 0; } .panel { padding: 8px 0; } }
@media (prefers-reduced-motion: reduce) { #mark { transition: none; } }
</style>
</head>
<body>
<nav class="views" aria-label="Sections"><button type="button" id="navTune">Tune</button><button type="button" id="navChords">Chords</button><button type="button" id="navScores">Scores</button></nav>
<main class="app" id="app">
  <nav class="tabs" aria-label="Tuning">
    <button type="button" id="tabHigh">High G</button>
    <button type="button" id="tabLow">Low G</button>
    <button type="button" id="tabMore" aria-haspopup="dialog">More</button>
  </nav>
  <svg id="head" viewBox="0 84 270 346" preserveAspectRatio="xMidYMax meet" role="group" aria-label="Ukulele headstock"></svg>
  <section class="panel">
    <div class="line"><span id="status" role="status"></span><span id="cents"></span></div>
    <svg id="scale" viewBox="0 0 270 54" aria-hidden="true">
      <path id="ticks" stroke="#65625A" stroke-width="1.5"/>
      <path d="M135 3v32" stroke="#111" stroke-width="2.5"/>
      <g id="mark" visibility="hidden"><path id="markBar" d="M135 1v36" stroke="#D9141E" stroke-width="7"/></g>
      <text x="4" y="52">−50</text><text x="135" y="52" text-anchor="middle">0</text><text x="266" y="52" text-anchor="end">+50</text>
    </svg>
    <p class="hint" id="hint"></p>
  </section>
</main>
<main class="chords" id="chords" hidden>
  <div id="roots" role="group" aria-label="Root note"></div>
  <div id="types" role="group" aria-label="Chord type"><button type="button" id="typeMore" aria-haspopup="dialog">More</button></div>
  <div class="title"><h2 id="chordName"></h2><span id="chordInfo"></span></div>
  <button type="button" id="boardBtn"><svg id="board" viewBox="0 0 240 240" aria-hidden="true"></svg></button>
  <div class="strums" role="group" aria-label="Hear this chord"><button type="button" id="strumDown">Strum ↓</button><button type="button" id="strumUp">Up ↑</button><button type="button" id="strumSlow">Note by note</button></div>
  <div class="row"><span id="fingerLabel"></span><div id="fingersRow" role="group" aria-label="Finger options"></div></div>
  <div class="row" style="min-height:30px"><span id="wayLabel"></span></div>
  <div id="ways" role="group" aria-label="Ways to play this chord"></div>
  <p id="chordNote"></p>
</main>
<main class="scores" id="scores" hidden>
  <div id="songList"></div>
  <div id="songPage" hidden>
    <button type="button" id="songBack">← All songs</button>
    <h2 id="songTitle"></h2>
    <p class="sub" id="songBy"></p>
    <div class="prow"><button type="button" id="viewSing">Sing along</button><button type="button" id="viewTab">Tab</button></div>
    <div id="songChords" role="group" aria-label="Chords in this song"></div>
    <p class="sub" id="strumText"></p>
    <div id="player">
      <div class="prow"><button type="button" id="playSong">Play</button><span id="speeds"><button type="button" data-speed="0.6">Slow</button><button type="button" data-speed="0.8">Medium</button><button type="button" data-speed="1">Full</button></span></div>
      <div class="prow" role="group" aria-label="What the app plays"><button type="button" id="partVoice">Singing</button><button type="button" id="partStrum">Strumming</button><button type="button" id="partPick">Uke melody</button></div>
      <span id="songStatus"></span>
    </div>
    <div id="songBody"></div>
  </div>
</main>
<dialog id="chordSheet" aria-labelledby="sheetName">
  <h2 id="sheetName"></h2>
  <svg id="sheetBoard" viewBox="0 0 240 240" role="img"></svg>
  <div class="strums" style="grid-template-columns:1fr 1fr"><button type="button" id="sheetStrum">Strum ↓</button><button type="button" id="sheetSlow">Note by note</button></div>
  <p class="note" id="sheetNote" style="border:0"></p>
  <button type="button" class="opt" id="sheetAll">See every way to play it<span>→</span></button>
  <button type="button" id="sheetClose" class="close">Done</button>
</dialog>
<dialog id="typeDialog" aria-labelledby="typeTitle">
  <h2 id="typeTitle">More chord types</h2>
  <div id="typeOptions"></div>
  <button type="button" id="typeClose" class="close">Done</button>
</dialog>
<dialog id="more" aria-labelledby="moreTitle">
  <h2 id="moreTitle">More tunings</h2>
  <div id="options"></div>
  <p class="note">Baritone, Canadian and low-string tunings usually need their own strings. Check before tightening.</p>
  <button type="button" class="opt" id="lefty" role="switch">Left-handed layout<span></span></button>
  <button type="button" id="close">Done</button>
</dialog>

<script>
// Strings are MIDI notes in order 4th, 3rd, 2nd, 1st. A4 (note 69) = 440 Hz.
const TUNINGS = {
  high:     { name: 'High G',         notes: [67, 60, 64, 69] },
  low:      { name: 'Low G',          notes: [55, 60, 64, 69] },
  d:        { name: 'D tuning',       notes: [69, 62, 66, 71] },
  canadian: { name: 'Canadian',       notes: [57, 62, 66, 71] },
  baritone: { name: 'Baritone',       notes: [50, 55, 59, 64] },
  slack:    { name: 'Slack key',      notes: [67, 60, 64, 67] },
  half:     { name: 'Half step down', notes: [66, 59, 63, 68] },
};
const NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
const noteName = m => NAMES[m % 12];
const noteFull = m => noteName(m) + (Math.floor(m / 12) - 1);
const noteFreq = m => 440 * 2 ** ((m - 69) / 12);
const IN_TUNE = 5, HOLD_MS = 350;

const $ = id => document.getElementById(id);
const load = k => { try { return localStorage.getItem(k); } catch (_) { return null; } };
const save = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} };

let tuningKey = load('tuning') || load('gMode');
if (!Object.hasOwn(TUNINGS, tuningKey)) tuningKey = 'low';
let lefty = load('lefty') === '1';
let selected = null;        // string being tuned, or null
let playing = null;         // string whose reference note is sounding
let state = 'idle';         // idle | listening | off | good
const tuned = new Set();
const note = i => TUNINGS[tuningKey].notes[i];

// ---- Headstock drawing ----
const POS = [
  { peg: [34, 272],  post: [92, 272],  nut: 105, end: [99, 272],  right: false },
  { peg: [34, 166],  post: [98, 166],  nut: 123, end: [105, 166], right: false },
  { peg: [236, 166], post: [172, 166], nut: 147, end: [165, 166], right: true },
  { peg: [236, 272], post: [178, 272], nut: 165, end: [171, 272], right: true },
];
const KNOB = 'M60 -10C60 -22 46 -26 32 -26C16 -26 10 -16 10 0C10 16 16 26 32 26C46 26 60 22 60 10Z';
const WOOD = `
<path d="M96 340h78v92h-78z" fill="#3A3A3A"/>
<path d="M84 122C84 102 104 106 112 96C120 84 150 84 158 96C166 106 186 102 186 122C186 152 190 162 190 192C190 222 198 242 198 284C198 318 174 322 174 344H96C96 322 72 318 72 284C72 242 80 222 80 192C80 162 84 152 84 122Z" fill="#141414"/>
<path d="M90 124C91 110 108 113 116 102C122 93 148 93 154 102C162 113 179 110 180 124C180 152 184 162 184 192C184 222 192 242 192 284C192 312 170 316 168 338H102C100 316 78 312 78 284C78 242 86 222 86 192C86 162 90 152 90 124Z" fill="none" stroke="#777"/>
<path d="M108 118C104 180 112 250 106 316M120 106C117 180 124 260 118 332M135 100C133 180 138 260 134 332M150 106C153 180 146 260 152 332M162 118C166 180 158 250 164 316" fill="none" stroke="#3A3A3A"/>
<rect x="93" y="340" width="84" height="9" fill="#F2F0EA" stroke="#141414"/>
<path d="M96 393h78" stroke="#D0D0D0" stroke-width="3"/>
<g fill="#A6A6A6" stroke="#141414"><path d="M60 160h22v12H60zM60 266h14v12H60zM188 160h22v12h-22zM196 266h14v12h-14z"/><path fill="#D8D8D8" d="M74 155h8v22h-8zM66 261h8v22h-8zM188 155h8v22h-8zM196 261h8v22h-8z"/></g>`;

function draw() {
  const fx = x => lefty ? 270 - x : x;
  const strings = POS.map((p, i) => {
    const on = i === selected || i === playing;
    const c = on ? (state === 'good' && playing === null ? '#FFFDF6' : '#FF3038') : '#C9C9C9';
    const [px, py] = p.post, [ex, ey] = p.end;
    return `<circle cx="${fx(px)}" cy="${py}" r="13" fill="#CFCFCF" stroke="#777"/>
      <path d="M${fx(p.nut)} 432V344L${fx(ex)} ${ey}" fill="none" stroke="${c}" stroke-width="${on ? 6 : 1.5}"/>
      <circle cx="${fx(px)}" cy="${py}" r="9" fill="none" stroke="${on ? c : '#141414'}" stroke-width="${on ? 4 : 1.5}"/>
      <circle cx="${fx(px)}" cy="${py}" r="4" fill="#555"/>`;
  }).join('');
  $('headArt').innerHTML = WOOD + strings;
  POS.forEach((p, i) => {
    const on = i === selected || i === playing, right = p.right !== lefty;
    const good = on && state === 'good' && playing === null;
    const g = $('peg' + i), [knob, hit, label, tick] = g.children;
    const x = fx(p.peg[0]);
    knob.setAttribute('transform', `translate(${right ? 270 : 0} ${p.peg[1]}) scale(${right ? -1 : 1} 1)`);
    knob.setAttribute('fill', good ? '#111111' : on ? '#D9141E' : '#FFFDF6');
    hit.setAttribute('x', right ? 200 : 0); hit.setAttribute('y', p.peg[1] - 48);
    label.textContent = noteName(note(i));
    label.setAttribute('x', x); label.setAttribute('y', p.peg[1] + 10);
    label.setAttribute('fill', on ? '#FFFFFF' : '#111111');
    tick.textContent = tuned.has(i) ? '✓' : '';
    tick.setAttribute('x', x); tick.setAttribute('y', p.peg[1] + 42);
    g.setAttribute('aria-label', `${noteFull(note(i))}${tuned.has(i) ? ', tuned' : ''}`);
    g.setAttribute('aria-pressed', i === selected);
  });
}

function buildHead() {
  $('head').innerHTML = '<g id="headArt"></g>' + POS.map((_, i) =>
    `<g class="peg" id="peg${i}" role="button" tabindex="0"><path class="knob" d="${KNOB}" stroke="#141414" stroke-width="2"/><rect width="70" height="96" fill="transparent"/><text text-anchor="middle" font-size="28"></text><text text-anchor="middle" font-size="14" fill="#111"></text></g>`).join('');
  POS.forEach((_, i) => {
    const g = $('peg' + i);
    let timer = 0, held = false, down = null;
    g.addEventListener('pointerdown', e => {
      if (down !== null || e.button) return;
      down = e.pointerId; held = false;
      try { g.setPointerCapture(e.pointerId); } catch (_) {}
      timer = setTimeout(() => { held = true; holdStart(i); }, HOLD_MS);
    });
    const end = (e, cancelled) => {
      if (e.pointerId !== down) return;
      down = null; clearTimeout(timer);
      if (held) holdEnd(!cancelled);
      else if (!cancelled) tapPeg(i);
      held = false;
    };
    g.addEventListener('pointerup', e => end(e, false));
    g.addEventListener('pointercancel', e => end(e, true));
    g.addEventListener('contextmenu', e => e.preventDefault());
    g.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) { e.preventDefault(); tapPeg(i); }
    });
    // Screen readers activate with a click that has no pointer press before it
    g.addEventListener('click', e => { if (e.detail === 0 && e.pointerType !== 'touch') tapPeg(i); });
  });
}

// ---- Panel ----
const setText = (id, t) => { if ($(id).textContent !== t) $(id).textContent = t; };
function show(next, status, cents, hint) {
  const changed = next !== state;
  state = next;
  $('app').classList.toggle('off', next === 'off');
  setText('status', status);
  setText('hint', hint);
  setText('cents', cents === null ? '' : `${cents > 0 ? '+' : cents < 0 ? '−' : ''}${Math.abs(cents)} cents`);
  $('mark').setAttribute('visibility', cents === null ? 'hidden' : 'visible');
  if (cents !== null) {
    $('mark').style.transform = `translateX(${Math.max(-50, Math.min(50, cents)) / 50 * 130}px)`;
    $('markBar').setAttribute('stroke', next === 'good' ? '#111111' : '#D9141E');
  }
  if (changed) draw();
}
function rest(message, hint) {
  if (selected === null) show('idle', message || 'Tap a peg to tune', null, hint || 'You hear its note first. Hold the peg to keep it playing');
  else {
    const n = noteName(note(selected));

  const body = $('songBody'); body.innerHTML = '';
  songView === 'sing' ? renderSing(body) : renderTab(body);
  renderParts();
}
function renderSing(body) {
  let lineEl = null, last = -1, fresh = false;
  song.ev.forEach((e, i) => {
    if (e.line !== last) { lineEl = document.createElement('div'); lineEl.className = 'lyric'; body.append(lineEl); last = e.line; fresh = true; }
    if (e.m === null && !e.chord) return;
    const cell = document.createElement('span'); cell.className = 'syl'; cell.dataset.n = i;
    const ch = e.chord || (fresh ? song.chords.filter(x => x.b <= e.b + 0.001).pop().name : ""); fresh = false;
    if (ch) cell.append(chordButton(ch, 'chordtag')); else { const x = document.createElement('i'); cell.append(x); }
    const w = document.createElement('span');
    w.textContent = e.w === '_' || !e.w ? '–' : e.w;
    if (e.w && e.w.endsWith('-')) cell.classList.add('join');
    cell.append(w);
    cell.addEventListener('click', () => playSong(song.bars[e.bar] < song.start ? song.start : song.bars[e.bar]));
    lineEl.append(cell);
  });
}
function renderTab(body) {
  const groups = [];
  song.ev.forEach((e, i) => { const g = e.bar >> 1; (groups[g] = groups[g] || []).push([e, i]); });
  groups.forEach(list => {
    const step = 30, W = Math.max(330, 44 + list.length * step + 12), gap = (W - 56) / list.length;
    let o = '', prev = list[0][0].bar;
    ['A', 'E', 'C', 'G'].forEach((n, k) => { o += `<text x="4" y="${35 + k * 18}" font-size="13" fill="#65625A">${n}</text><path d="M20 ${30 + k * 18}H${W - 4}" stroke="#8C887C"/>`; });
    o += `<path d="M20 30V84M${W - 4} 30V84" stroke="#111" stroke-width="1.5"/>`;
    list.forEach(([e, i], k) => {
      const x = 40 + k * gap;
      if (e.bar !== prev) { o += `<path d="M${x - gap / 2} 30V84" stroke="#111" stroke-width="1.5"/>`; prev = e.bar; }
      if (e.chord) o += `<g class="tabchord" role="button" tabindex="0" data-chord="${e.chord}" aria-label="Show how to play ${songChord(e.chord).label}"><rect x="${x - 16}" y="0" width="34" height="22" fill="transparent"/><text x="${x}" y="16" text-anchor="middle" font-size="15" fill="#D9141E">${songChord(e.chord).label}</text></g>`;
      if (e.m === null) { o += `<text x="${x}" y="62" text-anchor="middle" font-size="15" fill="#65625A">–</text>`; return; }
      const [st, fr] = tabPos(e.m), y = 30 + st * 18;
      o += `<g data-n="${i}" class="tabnote"><circle cx="${x}" cy="${y}" r="10" fill="#F1EEE4"/><text x="${x}" y="${y + 5}" text-anchor="middle" font-size="15" fill="#111">${fr}</text>`;
      if (e.w) o += `<text x="${x}" y="104" text-anchor="middle" font-size="11" fill="#65625A" class="tabword">${e.w.replace(/[_,.!?]/g, '')}</text>`;
      o += '</g>';
    });
    const d = document.createElement('div'); d.className = 'tabline';
    d.innerHTML = `<svg viewBox="0 0 ${W} ${song.w ? 110 : 92}" role="group" aria-label="Tab">${o}</svg>`;
    d.querySelectorAll('.tabchord').forEach(g => {
      g.addEventListener('click', () => showSongChord(g.dataset.chord));
      g.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); showSongChord(g.dataset.chord); } });
    });
    body.append(d);
  });
}
function renderParts() {
  [['partVoice', 'voice'], ['partStrum', 'strum'], ['partPick', 'pick']].forEach(([id, k]) => { $(id).classList.toggle('on', parts[k]); $(id).setAttribute('aria-pressed', parts[k]); });
  document.querySelectorAll('#speeds button').forEach(b => { const on = Number(b.dataset.speed) === speed; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  setText('playSong', run ? 'Stop' : 'Play');
  if (run) Object.keys(parts).forEach(k => run.bus[k].gain.setTargetAtTime(parts[k] ? 1 : 0, ctx.currentTime, 0.02));
}

// Player
let run = null, playToken = 0;
function stopSong() {
  playToken++;
  if (run) { clearInterval(run.timer); run.master.disconnect(); run = null; }
  document.querySelectorAll('#songPage .now').forEach(x => x.classList.remove('now'));
  if (song) { renderParts(); setText('songStatus', ''); }
}
function playSong(from) {
  stopSong(); strumId++; stopPlucks(); session('playback');
  const token = playToken, c = audio();
  const begin = () => {
    if (token !== playToken || !song) return;
    const master = c.createDynamicsCompressor(), bus = {};
    master.connect(c.destination);
    ['voice', 'strum', 'pick', 'click'].forEach(k => { bus[k] = c.createGain(); bus[k].gain.value = k === 'click' || parts[k] ? 1 : 0; bus[k].connect(master); });
    const spb = 60 / (song.bpm * speed), step = song.m === 6 ? 3 : 1, count = song.m;
    const t0 = c.currentTime + 0.15;
    for (let b = 0; b < count; b += step) click(c, bus.click, t0 + b * spb, b === 0);
    const sch = [];
    song.ev.forEach((e, i) => { if (e.m !== null && e.b >= from - 0.001) sch.push({ b: e.b, e, i }); });
    for (let b = Math.ceil(from); b < song.end - 0.001; b++) {
      const inBar = ((b % song.m) + song.m) % song.m;
      const ch = song.chords.filter(x => x.b <= b + 0.001).pop();
      if (ch && isDown(song, inBar)) sch.push({ b, strum: ch.name, strong: inBar === 0 });
    }
    sch.sort((p, q) => p.b - q.b);
    run = { master, bus, sch, next: 0, t0: t0 + count * spb, from, spb, last: null };
    run.timer = setInterval(tick, 40);
    setText('songStatus', 'Get ready'); renderParts(); tick();
  };
  if (c.state === 'running') begin(); else c.resume().then(begin).catch(() => {});
}
function tick() {
  if (!run) return;
  const c = ctx, r = run, at = b => r.t0 + (b - r.from) * r.spb;
  while (r.next < r.sch.length && at(r.sch[r.next].b) < c.currentTime + 0.4) {
    const x = r.sch[r.next++], t = Math.max(at(x.b), c.currentTime + 0.01);
    if (x.strum) chordNotes(x.strum).forEach((m, i) => hit(c, r.bus.strum, m, t + i * 0.025, x.strong ? 0.15 : 0.1));
    else { sing(c, r.bus.voice, x.e.m, t, x.e.d * r.spb); hit(c, r.bus.pick, x.e.m, t, 0.45); }
  }
  const now = r.from + (c.currentTime - r.t0) / r.spb;
  if (now < r.from - 0.02) return;
  if (now > song.end + 0.5) { stopSong(); return; }
  let cur = null;
  song.ev.forEach((e, i) => { if (e.m !== null && e.b <= now + 0.02 && e.b >= r.from - 0.001) cur = i; });
  const ch = song.chords.filter(x => x.b <= now + 0.02).pop();
  if (cur !== r.last) {
    r.last = cur;
    document.querySelectorAll('#songBody .now').forEach(x => x.classList.remove('now'));
    const el = document.querySelector(`#songBody [data-n="${cur}"]`);
    if (el) {
      el.classList.add('now');
      const line = el.closest('.lyric, .tabline');
      if (line !== r.line) {
        r.line = line;
        const box = $('songBody').getBoundingClientRect(), p = $('scores').getBoundingClientRect(), q = line.getBoundingClientRect(), bar = $('player').getBoundingClientRect();
        if (q.bottom > p.bottom - 8 || q.top < bar.bottom + 4) $('scores').scrollTop += q.top - bar.bottom - 8;
      }
    }
  }
  if (ch && ch.name !== r.chord) {
    r.chord = ch.name;
    document.querySelectorAll('#songChords button').forEach(b => b.classList.toggle('now', b.dataset.chord === ch.name));
    setText('songStatus', `Now: ${songChord(ch.name).label}`);
  }
}
function click(c, out, t, strong) {
  const o = c.createOscillator(), g = c.createGain();
  o.frequency.value = strong ? 1500 : 1000;
  g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
  o.connect(g).connect(out); o.start(t); o.stop(t + 0.07);
}
function hit(c, out, m, t, vol) {
  const s = c.createBufferSource(), g = c.createGain();
  s.buffer = pluckBuffer(m); g.gain.value = vol;
  s.connect(g).connect(out); s.start(t);
}
// A voice-like "ah": a buzz shaped by the resonances of a mouth, with gentle vibrato. It does not pronounce words.
function sing(c, out, m, t, dur) {
  const f = noteFreq(m), end = t + Math.max(0.1, dur * 0.94), env = c.createGain(), o = c.createOscillator(), v = c.createOscillator(), vg = c.createGain();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(f, t);
  v.frequency.value = 5.2; vg.gain.setValueAtTime(0, t); vg.gain.linearRampToValueAtTime(dur > 0.4 ? f * 0.006 : 0, t + Math.min(0.5, dur * 0.7));
  v.connect(vg).connect(o.frequency);
  env.gain.setValueAtTime(0.0001, t); env.gain.linearRampToValueAtTime(0.4, t + 0.05);
  env.gain.setValueAtTime(0.4, Math.max(t + 0.05, end - 0.05)); env.gain.linearRampToValueAtTime(0.0001, end);
  const low = c.createBiquadFilter(), lg = c.createGain(); low.type = 'lowpass'; low.frequency.value = f * 1.5; lg.gain.value = 0.5;
  o.connect(low).connect(lg).connect(env);
  [[800, 6, 0.9], [1200, 8, 0.5], [2800, 10, 0.18]].forEach(([fr, q, g]) => {
    const b = c.createBiquadFilter(), bg = c.createGain(); b.type = 'bandpass'; b.frequency.value = fr; b.Q.value = q; bg.gain.value = g;
    o.connect(b).connect(bg).connect(env);
  });
  env.connect(out); o.start(t); v.start(t); o.stop(end + 0.02); v.stop(end + 0.02);
}

// Chord sheet
let sheet = null;
function showSongChord(name) {
  if (run) stopSong();
  const c = songChord(name), v = voicings(c.root, c.type)[0];
  sheet = { ...c, name };
  setText('sheetName', c.label);
  $('sheetBoard').innerHTML = fretSvg(v, v.fs[0], true, c.root, c.type);
  $('sheetBoard').setAttribute('aria-label', spoken(v, v.fs[0]));
  setText('sheetNote', `${song ? `Strum each bar: ${STRUM[song.m]}. ` : ''}1 index, 2 middle, 3 ring, 4 little. ○ open string.`);
  if (!$('chordSheet').open) $('chordSheet').showModal();
  session('playback'); strum(chordNotes(name), 0.04);
}
$('sheetStrum').addEventListener('click', () => strum(chordNotes(sheet.name), 0.04));
$('sheetSlow').addEventListener('click', () => strum(chordNotes(sheet.name), 0.45));
$('sheetAll').addEventListener('click', () => { $('chordSheet').close(); setView('chords'); pickChord(sheet.root, sheet.type); });
$('sheetClose').addEventListener('click', () => $('chordSheet').close());
$('songBack').addEventListener('click', closeSong);
$('viewSing').addEventListener('click', () => { stopSong(); songView = 'sing'; renderSong(); });
$('viewTab').addEventListener('click', () => { stopSong(); songView = 'tab'; renderSong(); });
$('playSong').addEventListener('click', () => run ? stopSong() : playSong(song.start));
[['partVoice', 'voice'], ['partStrum', 'strum'], ['partPick', 'pick']].forEach(([id, k]) => $(id).addEventListener('click', () => { parts[k] = !parts[k]; renderParts(); }));
document.querySelectorAll('#speeds button').forEach(b => b.addEventListener('click', () => {
  const at = run ? Math.max(run.from, Math.floor((run.from + (ctx.currentTime - run.t0) / run.spb) / song.m) * song.m) : null;
  speed = Number(b.dataset.speed); renderParts();
  if (at !== null) playSong(Math.max(song.start, at));
}));
document.addEventListener('visibilitychange', () => { if (document.hidden) stopSong(); });
renderSongList();

// ---- Tune / Chords / Scores ----
function setView(v) {
  if (v !== 'tune' && (selected !== null || stream)) stopListening();
  if (v === 'chords') renderChord();
  stopSong();
  if (v === 'scores' && song) renderSong();
  strumId++; stopPlucks();
  $('app').hidden = v !== 'tune'; $('chords').hidden = v !== 'chords'; $('scores').hidden = v !== 'scores';
  [['navTune', 'tune'], ['navChords', 'chords'], ['navScores', 'scores']].forEach(([id, k]) => {
    $(id).classList.toggle('on', k === v);
    if (k === v) $(id).setAttribute('aria-current', 'page'); else $(id).removeAttribute('aria-current');
  });
  save('view', v);
}
$('navTune').addEventListener('click', () => setView('tune'));
$('navChords').addEventListener('click', () => setView('chords'));
$('navScores').addEventListener('click', () => { if ($('scores').hidden) setView('scores'); else if (song) closeSong(); });

$('ticks').setAttribute('d', Array.from({ length: 11 }, (_, i) => i === 5 ? '' : `M${5 + i * 26} 12v14`).join(''));
buildHead(); renderSettings(); rest(); draw();
setView(['chords', 'scores'].includes(load('view')) ? load('view') : 'tune');
</script>
